name: Build and release
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ /out:dist\NosClicker.exe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll src\NosClicker.cs
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed' }
      - name: Run self tests
        shell: pwsh
        run: |
          $p = Start-Process .\dist\NosClicker.exe -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw 'Self-test failed' }
          $hash = (Get-FileHash .\dist\NosClicker.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  NosClicker.exe" | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.2.0 *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Release v1.2.0 already exists; use a new version for subsequent releases.' }
          gh release create v1.2.0 .\dist\NosClicker.exe .\dist\SHA256SUMS.txt --target $env:GITHUB_SHA --title 'NOS Clicker 1.2.0' --notes 'Windows 10/11 portable EXE. ЛКМ/ПКМ, исправлено удержание: F6 зажимает, повторная F6 или Esc отпускает; удержание по умолчанию, 1–1000 CPS, без лимита, переназначение глобальной клавиши, Esc для остановки, сохранение настроек. Скачайте NosClicker.exe из Assets. Файл без цифровой подписи.'
          if ($LASTEXITCODE -ne 0) { throw 'Release failed' }
